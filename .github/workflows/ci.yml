name: Continuous Integration & Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: disaster_response_db
          MYSQL_USER: disaster_user
          MYSQL_PASSWORD: disaster_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate Database DDL Schema & Seeds
        run: python3 database/validate_db.py

      - name: Run Backend REST API Unit Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: disaster_user
          DB_PASSWORD: disaster_password
          DB_NAME: disaster_response_db
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: |
          node backend/tests/run_test.js

      - name: Run Security Assertion Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: disaster_user
          DB_PASSWORD: disaster_password
          DB_NAME: disaster_response_db
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: |
          node backend/tests/run_security_tests.js

      - name: Build Frontend SPA
        env:
          VITE_API_BASE_URL: https://dbms-project-final-7h2f.onrender.com/api
        run: |
          cd frontend
          npm run build
